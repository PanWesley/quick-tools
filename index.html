<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diff 对比工具</title>
<!-- Prism.js for syntax highlighting -->
<link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" id="prism-theme">
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-javascript.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-java.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-css.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-markup.min.js"></script>
<style>
  /* CSS Variables for theming */
  :root {
    --primary: #2DBAA3;
    --primary-hover: #25A08C;
    --bg: #f5f7fa;
    --card-bg: #ffffff;
    --text: #2c3e50;
    --text-secondary: #7f8c8d;
    --border: #e1e8ed;
    --added-bg: #e6ffed;
    --added-border: #b4e2c4;
    --added-text: #1a7f37;
    --added-highlight: #acf2bd;
    --removed-bg: #ffebe9;
    --removed-border: #ffc1ba;
    --removed-text: #cf222e;
    --removed-highlight: #fd8c73;
    --line-num: #adb5bd;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
    --radius: 10px;
    --code-bg: #f8f9fa;
  }

  /* Dark mode variables */
  [data-theme="dark"] {
    --bg: #0d1117;
    --card-bg: #161b22;
    --text: #c9d1d9;
    --text-secondary: #8b949e;
    --border: #30363d;
    --added-bg: #0f3d1f;
    --added-border: #238636;
    --added-text: #7ee787;
    --added-highlight: #2ea043;
    --removed-bg: #3d0f1f;
    --removed-border: #da3633;
    --removed-text: #ffa198;
    --removed-highlight: #f85149;
    --line-num: #484f58;
    --shadow: 0 2px 12px rgba(0,0,0,0.3);
    --code-bg: #0d1117;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    transition: background 0.3s, color 0.3s;
  }

  header {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    transition: background 0.3s, border-color 0.3s;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 20px;
    font-weight: 700;
    color: var(--primary);
    text-decoration: none;
  }

  .logo svg { width: 28px; height: 28px; }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .mode-select {
    padding: 7px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card-bg);
    font-size: 14px;
    color: var(--text);
    cursor: pointer;
    outline: none;
    transition: border-color 0.2s;
  }

  .mode-select:hover { border-color: var(--primary); }

  /* Theme toggle button */
  .theme-toggle {
    width: 40px;
    height: 40px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card-bg);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    transition: all 0.2s;
  }

  .theme-toggle:hover { border-color: var(--primary); }

  /* History dropdown */
  .history-dropdown {
    position: relative;
  }

  .history-btn {
    padding: 7px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card-bg);
    font-size: 14px;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
  }

  .history-btn:hover { border-color: var(--primary); }

  .history-menu {
    position: absolute;
    top: 100%;
    right: 0;
    margin-top: 8px;
    min-width: 280px;
    max-height: 400px;
    overflow-y: auto;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: var(--shadow);
    z-index: 100;
    display: none;
  }

  .history-menu.show { display: block; }

  .history-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    font-size: 14px;
  }

  .history-clear {
    font-size: 12px;
    color: var(--text-secondary);
    cursor: pointer;
    background: none;
    border: none;
  }

  .history-clear:hover { color: var(--removed-text); }

  .history-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .history-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.2s;
  }

  .history-item:last-child { border-bottom: none; }

  .history-item:hover { background: var(--bg); }

  .history-info {
    flex: 1;
    overflow: hidden;
  }

  .history-name {
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .history-time {
    font-size: 11px;
    color: var(--text-secondary);
  }

  .history-delete {
    width: 24px;
    height: 24px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }

  .history-delete:hover { background: var(--removed-bg); color: var(--removed-text); }

  .history-empty {
    padding: 20px;
    text-align: center;
    color: var(--text-secondary);
    font-size: 13px;
  }

  main {
    flex: 1;
    padding: 24px 32px;
    max-width: 1400px;
    width: 100%;
    margin: 0 auto;
  }

  .input-section {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }

  .input-panel {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: background 0.3s;
  }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    transition: background 0.3s, border-color 0.3s;
  }

  .panel-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
  }

  .panel-actions {
    display: flex;
    gap: 8px;
  }

  .btn-small {
    padding: 5px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--card-bg);
    font-size: 12px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .btn-small:hover { border-color: var(--primary); color: var(--primary); }

  /* Code editor with syntax highlighting */
  .code-editor-container {
    flex: 1;
    position: relative;
    min-height: 280px;
  }

  .code-editor {
    width: 100%;
    height: 100%;
    min-height: 280px;
    padding: 16px;
    border: none;
    outline: none;
    resize: vertical;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    font-size: 13px;
    line-height: 1.6;
    color: var(--text);
    background: var(--code-bg);
    white-space: pre;
    overflow: auto;
  }

  textarea.text-input {
    flex: 1;
    min-height: 280px;
    padding: 16px;
    border: none;
    outline: none;
    resize: vertical;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    font-size: 13px;
    line-height: 1.6;
    color: var(--text);
    background: var(--code-bg);
    transition: background 0.3s;
  }

  textarea.text-input::placeholder { color: var(--line-num); }

  .action-bar {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .btn-primary {
    padding: 12px 36px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 2px 8px rgba(45,186,163,0.3);
  }

  .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(45,186,163,0.4); }
  .btn-primary:active { transform: translateY(0); }

  .btn-secondary {
    padding: 12px 24px;
    background: var(--card-bg);
    color: var(--text-secondary);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }

  .btn-secondary.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }

  .stats-bar {
    display: none;
    align-items: center;
    gap: 20px;
    padding: 10px 16px;
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 16px;
    font-size: 13px;
    color: var(--text-secondary);
    transition: background 0.3s;
  }

  .stats-bar.visible { display: flex; }

  .stat-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .stat-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .stat-dot.added { background: var(--added-text); }
  .stat-dot.removed { background: var(--removed-text); }
  .stat-dot.unchanged { background: var(--line-num); }

  .stat-count { font-weight: 600; color: var(--text); }

  .result-section {
    display: none;
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: background 0.3s;
  }

  .result-section.visible { display: block; }

  .result-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    transition: background 0.3s, border-color 0.3s;
    flex-wrap: wrap;
    gap: 10px;
  }

  .result-title {
    font-size: 14px;
    font-weight: 600;
  }

  .result-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .view-toggle {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }

  .view-btn {
    padding: 5px 14px;
    border: none;
    background: var(--card-bg);
    font-size: 12px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s;
  }

  .view-btn.active { background: var(--primary); color: #fff; }
  .view-btn:hover:not(.active) { background: var(--bg); }

  .diff-container {
    overflow-x: auto;
    max-height: 600px;
    overflow-y: auto;
  }

  .diff-table {
    width: 100%;
    border-collapse: collapse;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    font-size: 13px;
    line-height: 1.6;
  }

  .diff-table td {
    padding: 2px 12px;
    vertical-align: top;
    white-space: pre;
  }

  .diff-line-num {
    width: 50px;
    min-width: 50px;
    text-align: right;
    color: var(--line-num);
    user-select: none;
    border-right: 1px solid var(--border);
    padding-right: 10px;
    font-size: 12px;
  }

  .diff-line-content {
    padding-left: 12px;
  }

  tr.diff-added { background: var(--added-bg); }
  tr.diff-added .diff-line-num { background: var(--added-border); color: var(--added-text); }

  tr.diff-removed { background: var(--removed-bg); }
  tr.diff-removed .diff-line-num { background: var(--removed-border); color: var(--removed-text); }

  tr.diff-unchanged { background: var(--card-bg); }

  /* Hide unchanged rows when filter is active */
  .hide-unchanged tr.diff-unchanged { display: none; }

  .char-added {
    background: var(--added-highlight);
    border-radius: 3px;
    padding: 1px 0;
  }

  .char-removed {
    background: var(--removed-highlight);
    border-radius: 3px;
    padding: 1px 0;
  }

  .unified-view .diff-table { table-layout: auto; }

  .side-by-side-view {
    display: grid;
    grid-template-columns: 1fr 1fr;
    overflow: hidden;
    max-height: 600px;
  }

  .side-by-side-view .diff-pane {
    overflow: auto;
    max-height: 600px;
    border-right: 1px solid var(--border);
  }

  .side-by-side-view .diff-pane:last-child { border-right: none; }
  .side-by-side-view .diff-table { table-layout: fixed; }

  /* Syntax highlighting in diff results */
  .diff-line-content code {
    background: transparent !important;
    padding: 0 !important;
    font-family: inherit !important;
    font-size: inherit !important;
  }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
    color: var(--text-secondary);
  }

  .empty-state svg { width: 48px; height: 48px; margin-bottom: 16px; opacity: 0.4; }
  .empty-state p { font-size: 14px; }

  footer {
    padding: 16px 32px;
    text-align: center;
    color: var(--line-num);
    font-size: 12px;
    border-top: 1px solid var(--border);
    background: var(--card-bg);
    transition: background 0.3s, border-color 0.3s;
  }

  .file-input { display: none; }

  @media (max-width: 768px) {
    .input-section { grid-template-columns: 1fr; }
    main { padding: 16px; }
    header { padding: 12px 16px; }
    .side-by-side-view { grid-template-columns: 1fr; }
    .side-by-side-view .diff-pane { border-right: none; border-bottom: 1px solid var(--border); }
    .result-header { flex-direction: column; align-items: flex-start; }
  }

  .diff-container::-webkit-scrollbar,
  .side-by-side-view .diff-pane::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }

  .diff-container::-webkit-scrollbar-track,
  .side-by-side-view .diff-pane::-webkit-scrollbar-track {
    background: var(--bg);
  }

  .diff-container::-webkit-scrollbar-thumb,
  .side-by-side-view .diff-pane::-webkit-scrollbar-thumb {
    background: var(--line-num);
    border-radius: 4px;
  }

  .diff-container::-webkit-scrollbar-thumb:hover,
  .side-by-side-view .diff-pane::-webkit-scrollbar-thumb:hover {
    background: var(--text-secondary);
  }
</style>
</head>
<body>

<header>
  <a class="logo" href="#">
    <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="28" height="28" rx="6" fill="#2DBAA3"/>
      <path d="M8 10h12M8 14h8M8 18h10" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <circle cx="22" cy="18" r="3" fill="#fff" fill-opacity="0.3"/>
      <path d="M21 17l2 2 2-3" stroke="#fff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Diff 对比工具
  </a>
  <div class="header-actions">
    <div class="history-dropdown">
      <button class="history-btn" onclick="toggleHistoryMenu()">
        📜 历史记录
      </button>
      <div class="history-menu" id="historyMenu">
        <div class="history-header">
          <span>对比历史</span>
          <button class="history-clear" onclick="clearAllHistory()">清空全部</button>
        </div>
        <ul class="history-list" id="historyList">
          <li class="history-empty">暂无历史记录</li>
        </ul>
      </div>
    </div>
    <select class="mode-select" id="diffMode">
      <option value="chars">字符级别</option>
      <option value="words">单词级别</option>
      <option value="lines">行级别</option>
    </select>
    <button class="theme-toggle" onclick="toggleTheme()" title="切换主题">
      <span id="theme-icon">🌙</span>
    </button>
  </div>
</header>

<main>
  <div class="input-section">
    <div class="input-panel">
      <div class="panel-header">
        <span class="panel-title">📄 原始文本</span>
        <div class="panel-actions">
          <button class="btn-small" onclick="loadFile('left')">📁 打开文件</button>
          <button class="btn-small" onclick="clearText('left')">🗑 清空</button>
        </div>
      </div>
      <textarea class="text-input" id="textLeft" placeholder="在此粘贴或输入原始文本..." spellcheck="false"></textarea>
      <input type="file" class="file-input" id="fileLeft" onchange="handleFile(this, 'left')">
    </div>
    <div class="input-panel">
      <div class="panel-header">
        <span class="panel-title">📝 修改后文本</span>
        <div class="panel-actions">
          <button class="btn-small" onclick="loadFile('right')">📁 打开文件</button>
          <button class="btn-small" onclick="clearText('right')">🗑 清空</button>
        </div>
      </div>
      <textarea class="text-input" id="textRight" placeholder="在此粘贴或输入修改后的文本..." spellcheck="false"></textarea>
      <input type="file" class="file-input" id="fileRight" onchange="handleFile(this, 'right')">
    </div>
  </div>

  <div class="action-bar">
    <button class="btn-primary" onclick="runDiff()">🔍 查找差异</button>
    <button class="btn-secondary" id="autoDiffBtn" onclick="toggleAutoDiff()">⚡ 实时对比</button>
    <button class="btn-secondary" onclick="swapText()">⇄ 交换</button>
    <button class="btn-secondary" onclick="loadSample()">📋 加载示例</button>
  </div>

  <div class="stats-bar" id="statsBar">
    <div class="stat-item">
      <span class="stat-dot added"></span>
      <span>新增 <span class="stat-count" id="addedCount">0</span> 行</span>
    </div>
    <div class="stat-item">
      <span class="stat-dot removed"></span>
      <span>删除 <span class="stat-count" id="removedCount">0</span> 行</span>
    </div>
    <div class="stat-item">
      <span class="stat-dot unchanged"></span>
      <span>未变 <span class="stat-count" id="unchangedCount">0</span> 行</span>
    </div>
  </div>

  <div class="result-section" id="resultSection">
    <div class="result-header">
      <span class="result-title">📊 对比结果</span>
      <div class="result-actions">
        <button class="btn-small" id="hideUnchangedBtn" onclick="toggleHideUnchanged()">👁 隐藏未变行</button>
        <button class="btn-small" onclick="downloadResult()">💾 下载结果</button>
        <div class="view-toggle">
          <button class="view-btn active" onclick="setView('unified', this)">合并视图</button>
          <button class="view-btn" onclick="setView('side-by-side', this)">并排视图</button>
        </div>
      </div>
    </div>
    <div id="diffOutput"></div>
  </div>
</main>

<footer>
  © 2026 Diff 对比工具 — 纯前端实现，数据不会上传到任何服务器
</footer>

<script>
// ==================== History Management ====================
const HISTORY_KEY = 'diff-tool-history';
const MAX_HISTORY_ITEMS = 10;

function getHistory() {
  try {
    const data = localStorage.getItem(HISTORY_KEY);
    return data ? JSON.parse(data) : [];
  } catch (e) {
    return [];
  }
}

function saveHistory(history) {
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
}

function addToHistory(leftText, rightText) {
  if (!leftText && !rightText) return;
  
  const history = getHistory();
  const now = new Date();
  const item = {
    id: Date.now(),
    timestamp: now.toISOString(),
    leftText: leftText,
    rightText: rightText,
    name: generateHistoryName(leftText, rightText)
  };
  
  // Check for duplicate (same content as most recent)
  if (history.length > 0) {
    const last = history[0];
    if (last.leftText === leftText && last.rightText === rightText) {
      return;
    }
  }
  
  // Add to beginning, limit to MAX_HISTORY_ITEMS
  history.unshift(item);
  if (history.length > MAX_HISTORY_ITEMS) {
    history.pop();
  }
  
  saveHistory(history);
  renderHistoryList();
}

function generateHistoryName(leftText, rightText) {
  // Try to extract a meaningful name from the content
  const firstLine = (leftText || rightText).split('\n')[0].trim();
  if (firstLine.length > 30) {
    return firstLine.substring(0, 30) + '...';
  }
  return firstLine || '空对比';
}

function formatTime(isoString) {
  const date = new Date(isoString);
  const now = new Date();
  const diff = now - date;
  
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
  if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
  return date.toLocaleDateString('zh-CN');
}

function renderHistoryList() {
  const history = getHistory();
  const listEl = document.getElementById('historyList');
  
  if (history.length === 0) {
    listEl.innerHTML = '<li class="history-empty">暂无历史记录</li>';
    return;
  }
  
  listEl.innerHTML = history.map(item => `
    <li class="history-item" onclick="loadHistoryItem(${item.id})">
      <div class="history-info">
        <div class="history-name">${escapeHtml(item.name)}</div>
        <div class="history-time">${formatTime(item.timestamp)}</div>
      </div>
      <button class="history-delete" onclick="event.stopPropagation(); deleteHistoryItem(${item.id})" title="删除">
        ×
      </button>
    </li>
  `).join('');
}

function loadHistoryItem(id) {
  const history = getHistory();
  const item = history.find(h => h.id === id);
  if (item) {
    document.getElementById('textLeft').value = item.leftText;
    document.getElementById('textRight').value = item.rightText;
    hideHistoryMenu();
    if (autoDiffEnabled) {
      runDiff();
    }
  }
}

function deleteHistoryItem(id) {
  let history = getHistory();
  history = history.filter(h => h.id !== id);
  saveHistory(history);
  renderHistoryList();
}

function clearAllHistory() {
  if (confirm('确定要清空所有历史记录吗？')) {
    localStorage.removeItem(HISTORY_KEY);
    renderHistoryList();
  }
}

function toggleHistoryMenu() {
  const menu = document.getElementById('historyMenu');
  menu.classList.toggle('show');
  if (menu.classList.contains('show')) {
    renderHistoryList();
  }
}

function hideHistoryMenu() {
  document.getElementById('historyMenu').classList.remove('show');
}

// Close history menu when clicking outside
document.addEventListener('click', function(e) {
  const dropdown = document.querySelector('.history-dropdown');
  if (dropdown && !dropdown.contains(e.target)) {
    hideHistoryMenu();
  }
});

// ==================== Theme Management ====================
function initTheme() {
  const savedTheme = localStorage.getItem('diff-tool-theme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon(savedTheme);
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('diff-tool-theme', newTheme);
  updateThemeIcon(newTheme);
  
  // Update Prism theme
  const prismTheme = document.getElementById('prism-theme');
  if (newTheme === 'dark') {
    prismTheme.href = 'https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css';
  } else {
    prismTheme.href = 'https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism.min.css';
  }
}

function updateThemeIcon(theme) {
  document.getElementById('theme-icon').textContent = theme === 'dark' ? '☀️' : '🌙';
}

// ==================== Auto Diff ====================
let autoDiffEnabled = false;
let autoDiffInterval = null;

function toggleAutoDiff() {
  autoDiffEnabled = !autoDiffEnabled;
  const btn = document.getElementById('autoDiffBtn');
  if (autoDiffEnabled) {
    btn.classList.add('active');
    btn.textContent = '⚡ 实时对比 (开)';
    startAutoDiff();
  } else {
    btn.classList.remove('active');
    btn.textContent = '⚡ 实时对比';
    stopAutoDiff();
  }
}

function startAutoDiff() {
  let lastLeft = '';
  let lastRight = '';
  autoDiffInterval = setInterval(() => {
    const left = document.getElementById('textLeft').value;
    const right = document.getElementById('textRight').value;
    if (left !== lastLeft || right !== lastRight) {
      lastLeft = left;
      lastRight = right;
      if (left || right) {
        runDiff();
      }
    }
  }, 500);
}

function stopAutoDiff() {
  if (autoDiffInterval) {
    clearInterval(autoDiffInterval);
    autoDiffInterval = null;
  }
}

// ==================== Hide Unchanged ====================
let hideUnchangedEnabled = false;

function toggleHideUnchanged() {
  hideUnchangedEnabled = !hideUnchangedEnabled;
  const btn = document.getElementById('hideUnchangedBtn');
  const output = document.getElementById('diffOutput');
  
  if (hideUnchangedEnabled) {
    btn.classList.add('active');
    btn.textContent = '👁 显示未变行';
    output.classList.add('hide-unchanged');
  } else {
    btn.classList.remove('active');
    btn.textContent = '👁 隐藏未变行';
    output.classList.remove('hide-unchanged');
  }
}

// ==================== Download Result ====================
function downloadResult() {
  if (currentLines.length === 0) {
    alert('请先进行对比');
    return;
  }
  
  let content = 'Diff 对比结果\n';
  content += '================\n\n';
  content += '统计：新增 ' + document.getElementById('addedCount').textContent + ' 行，';
  content += '删除 ' + document.getElementById('removedCount').textContent + ' 行，';
  content += '未变 ' + document.getElementById('unchangedCount').textContent + ' 行\n\n';
  
  for (const line of currentLines) {
    if (line.type === 'unchanged') {
      content += '  ' + line.content + '\n';
    } else if (line.type === 'removed') {
      content += '- ' + line.content + '\n';
    } else if (line.type === 'added') {
      content += '+ ' + line.content + '\n';
    } else if (line.type === 'changed') {
      content += '- ' + line.oldContent + '\n';
      content += '+ ' + line.newContent + '\n';
    }
  }
  
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'diff-result-' + new Date().toISOString().slice(0, 10) + '.txt';
  a.click();
  URL.revokeObjectURL(url);
}

// ==================== Diff Algorithm (LCS-based) ====================
function lcsTable(a, b) {
  const n = a.length, m = b.length;
  const dp = new Array((n + 1) * (m + 1)).fill(0);
  for (let i = 1; i <= n; i++) {
    const row = i * (m + 1);
    for (let j = 1; j <= m; j++) {
      if (a[i - 1] === b[j - 1]) {
        dp[row + j] = dp[(i - 1) * (m + 1) + (j - 1)] + 1;
      } else {
        dp[row + j] = Math.max(dp[(i - 1) * (m + 1) + j], dp[row + (j - 1)]);
      }
    }
  }
  return dp;
}

function backtrackLCS(dp, a, b, n, m) {
  const diffs = [];
  let i = n, j = m;
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && a[i - 1] === b[j - 1]) {
      diffs.unshift({ type: 'unchanged', oldVal: a[i - 1], newVal: b[j - 1] });
      i--; j--;
    } else if (j > 0 && (i === 0 || dp[i * (m + 1) + (j - 1)] >= dp[(i - 1) * (m + 1) + j])) {
      diffs.unshift({ type: 'added', newVal: b[j - 1] });
      j--;
    } else {
      diffs.unshift({ type: 'removed', oldVal: a[i - 1] });
      i--;
    }
  }
  return diffs;
}

function computeDiff(oldText, newText, mode) {
  let oldTokens, newTokens;
  if (mode === 'lines') {
    oldTokens = oldText.split('\n');
    newTokens = newText.split('\n');
  } else if (mode === 'words') {
    oldTokens = oldText.split(/(\s+)/);
    newTokens = newText.split(/(\s+)/);
  } else {
    oldTokens = oldText.split('');
    newTokens = newText.split('');
  }

  const n = oldTokens.length;
  const m = newTokens.length;

  if (n * m > 250000) {
    return simpleDiff(oldTokens, newTokens);
  }

  const dp = lcsTable(oldTokens, newTokens);
  return backtrackLCS(dp, oldTokens, newTokens, n, m);
}

function simpleDiff(a, b) {
  const diffs = [];
  for (const item of a) diffs.push({ type: 'removed', oldVal: item });
  for (const item of b) diffs.push({ type: 'added', newVal: item });
  return diffs;
}

// ==================== Line-level Diff ====================
function computeLineDiff(oldText, newText) {
  const diffs = computeDiff(oldText, newText, 'lines');
  const lines = [];
  let i = 0;

  while (i < diffs.length) {
    if (diffs[i].type === 'unchanged') {
      lines.push({ type: 'unchanged', oldNum: null, newNum: null, content: diffs[i].oldVal });
      i++;
    } else {
      const removed = [];
      const added = [];
      while (i < diffs.length && diffs[i].type === 'removed') {
        removed.push(diffs[i].oldVal);
        i++;
      }
      while (i < diffs.length && diffs[i].type === 'added') {
        added.push(diffs[i].newVal);
        i++;
      }

      const maxLen = Math.max(removed.length, added.length);
      for (let j = 0; j < maxLen; j++) {
        if (j < removed.length && j < added.length) {
          const charDiff = computeCharDiff(removed[j], added[j]);
          lines.push({ type: 'changed', oldContent: removed[j], newContent: added[j], charDiff });
        } else if (j < removed.length) {
          lines.push({ type: 'removed', content: removed[j] });
        } else {
          lines.push({ type: 'added', content: added[j] });
        }
      }
    }
  }

  let oldLine = 0, newLine = 0;
  for (const line of lines) {
    if (line.type === 'unchanged') { oldLine++; newLine++; line.oldNum = oldLine; line.newNum = newLine; }
    else if (line.type === 'removed') { oldLine++; line.oldNum = oldLine; }
    else if (line.type === 'added') { newLine++; line.newNum = newLine; }
    else if (line.type === 'changed') { oldLine++; newLine++; line.oldNum = oldLine; line.newNum = newLine; }
  }

  return lines;
}

function computeCharDiff(oldStr, newStr) {
  if (oldStr.length * newStr.length > 10000) {
    return [
      { type: 'removed', value: oldStr },
      { type: 'added', value: newStr }
    ];
  }
  const diffs = computeDiff(oldStr, newStr, 'chars');
  const result = [];
  for (const d of diffs) {
    if (d.type === 'unchanged') result.push({ type: 'unchanged', value: d.oldVal });
    else if (d.type === 'removed') result.push({ type: 'removed', value: d.oldVal });
    else if (d.type === 'added') result.push({ type: 'added', value: d.newVal });
  }
  return result;
}

// ==================== Syntax Highlighting ====================
function highlightCode(code, language) {
  if (!code) return '';
  // Auto-detect language if not specified
  if (!language) {
    if (code.includes('function') || code.includes('const') || code.includes('let') || code.includes('var')) {
      language = 'javascript';
    } else if (code.includes('def ') || code.includes('import ') && code.includes(':')) {
      language = 'python';
    } else if (code.includes('<') && code.includes('>')) {
      language = 'markup';
    } else {
      language = 'javascript';
    }
  }
  
  try {
    const highlighted = Prism.highlight(code, Prism.languages[language] || Prism.languages.javascript, language);
    return highlighted;
  } catch (e) {
    return escapeHtml(code);
  }
}

// ==================== Rendering ====================
function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function renderCharDiff(charDiff, side) {
  let html = '';
  for (const part of charDiff) {
    const escaped = escapeHtml(part.value);
    if (part.type === 'unchanged') {
      html += escaped;
    } else if (part.type === 'removed' && side === 'old') {
      html += '<span class="char-removed">' + escaped + '</span>';
    } else if (part.type === 'added' && side === 'new') {
      html += '<span class="char-added">' + escaped + '</span>';
    }
  }
  return html;
}

function renderUnifiedView(lines) {
  let html = '<div class="diff-container unified-view"><table class="diff-table">';
  for (const line of lines) {
    if (line.type === 'unchanged') {
      const highlighted = highlightCode(line.content);
      html += '<tr class="diff-unchanged"><td class="diff-line-num">' + line.oldNum + '</td><td class="diff-line-num">' + line.newNum + '</td><td class="diff-line-content"><code class="language-javascript">' + highlighted + '</code></td></tr>';
    } else if (line.type === 'removed') {
      const highlighted = highlightCode(line.content);
      html += '<tr class="diff-removed"><td class="diff-line-num">' + line.oldNum + '</td><td class="diff-line-num"></td><td class="diff-line-content"><code class="language-javascript">' + highlighted + '</code></td></tr>';
    } else if (line.type === 'added') {
      const highlighted = highlightCode(line.content);
      html += '<tr class="diff-added"><td class="diff-line-num"></td><td class="diff-line-num">' + line.newNum + '</td><td class="diff-line-content"><code class="language-javascript">' + highlighted + '</code></td></tr>';
    } else if (line.type === 'changed') {
      const oldHighlighted = renderCharDiff(line.charDiff, 'old');
      const newHighlighted = renderCharDiff(line.charDiff, 'new');
      html += '<tr class="diff-removed"><td class="diff-line-num">' + line.oldNum + '</td><td class="diff-line-num"></td><td class="diff-line-content"><code class="language-javascript">' + oldHighlighted + '</code></td></tr>';
      html += '<tr class="diff-added"><td class="diff-line-num"></td><td class="diff-line-num">' + line.newNum + '</td><td class="diff-line-content"><code class="language-javascript">' + newHighlighted + '</code></td></tr>';
    }
  }
  html += '</table></div>';
  return html;
}

function renderSideBySideView(lines) {
  let leftHtml = '<div class="diff-pane"><table class="diff-table">';
  let rightHtml = '<div class="diff-pane"><table class="diff-table">';

  for (const line of lines) {
    if (line.type === 'unchanged') {
      const highlighted = highlightCode(line.content);
      leftHtml += '<tr class="diff-unchanged"><td class="diff-line-num">' + line.oldNum + '</td><td class="diff-line-content"><code class="language-javascript">' + highlighted + '</code></td></tr>';
      rightHtml += '<tr class="diff-unchanged"><td class="diff-line-num">' + line.newNum + '</td><td class="diff-line-content"><code class="language-javascript">' + highlighted + '</code></td></tr>';
    } else if (line.type === 'removed') {
      const highlighted = highlightCode(line.content);
      leftHtml += '<tr class="diff-removed"><td class="diff-line-num">' + line.oldNum + '</td><td class="diff-line-content"><code class="language-javascript">' + highlighted + '</code></td></tr>';
      rightHtml += '<tr class="diff-unchanged" style="background:var(--bg)"><td class="diff-line-num"></td><td class="diff-line-content" style="color:var(--line-num)">-</td></tr>';
    } else if (line.type === 'added') {
      const highlighted = highlightCode(line.content);
      leftHtml += '<tr class="diff-unchanged" style="background:var(--bg)"><td class="diff-line-num"></td><td class="diff-line-content" style="color:var(--line-num)">-</td></tr>';
      rightHtml += '<tr class="diff-added"><td class="diff-line-num">' + line.newNum + '</td><td class="diff-line-content"><code class="language-javascript">' + highlighted + '</code></td></tr>';
    } else if (line.type === 'changed') {
      const oldHighlighted = renderCharDiff(line.charDiff, 'old');
      const newHighlighted = renderCharDiff(line.charDiff, 'new');
      leftHtml += '<tr class="diff-removed"><td class="diff-line-num">' + line.oldNum + '</td><td class="diff-line-content"><code class="language-javascript">' + oldHighlighted + '</code></td></tr>';
      rightHtml += '<tr class="diff-added"><td class="diff-line-num">' + line.newNum + '</td><td class="diff-line-content"><code class="language-javascript">' + newHighlighted + '</code></td></tr>';
    }
  }

  leftHtml += '</table></div>';
  rightHtml += '</table></div>';
  return '<div class="side-by-side-view">' + leftHtml + rightHtml + '</div>';
}

// ==================== Actions ====================
let currentView = 'unified';
let currentLines = [];

function runDiff() {
  const oldText = document.getElementById('textLeft').value;
  const newText = document.getElementById('textRight').value;

  if (!oldText && !newText) {
    alert('请输入或粘贴要对比的文本');
    return;
  }

  // Save to history
  addToHistory(oldText, newText);

  try {
    currentLines = computeLineDiff(oldText, newText);
  } catch (e) {
    console.error('Diff error:', e);
    alert('对比计算出错，请尝试缩短文本内容');
    return;
  }

  let added = 0, removed = 0, unchanged = 0;
  for (const line of currentLines) {
    if (line.type === 'added') added++;
    else if (line.type === 'removed') removed++;
    else if (line.type === 'unchanged') unchanged++;
    else if (line.type === 'changed') { added++; removed++; }
  }

  document.getElementById('addedCount').textContent = added;
  document.getElementById('removedCount').textContent = removed;
  document.getElementById('unchangedCount').textContent = unchanged;
  document.getElementById('statsBar').classList.add('visible');
  document.getElementById('resultSection').classList.add('visible');

  renderDiff();
}

function renderDiff() {
  const output = document.getElementById('diffOutput');
  if (currentView === 'unified') {
    output.innerHTML = renderUnifiedView(currentLines);
  } else {
    output.innerHTML = renderSideBySideView(currentLines);
  }
  // Re-apply hide unchanged if enabled
  if (hideUnchangedEnabled) {
    output.classList.add('hide-unchanged');
  }
}

function setView(view, btn) {
  currentView = view;
  document.querySelectorAll('.view-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  if (currentLines.length > 0) renderDiff();
}

function loadFile(side) {
  document.getElementById(side === 'left' ? 'fileLeft' : 'fileRight').click();
}

function handleFile(input, side) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    document.getElementById(side === 'left' ? 'textLeft' : 'textRight').value = e.target.result;
    if (autoDiffEnabled) runDiff();
  };
  reader.readAsText(file);
  input.value = '';
}

function clearText(side) {
  document.getElementById(side === 'left' ? 'textLeft' : 'textRight').value = '';
  if (autoDiffEnabled) runDiff();
}

function swapText() {
  const left = document.getElementById('textLeft');
  const right = document.getElementById('textRight');
  const temp = left.value;
  left.value = right.value;
  right.value = temp;
  if (autoDiffEnabled) runDiff();
}

function loadSample() {
  document.getElementById('textLeft').value = 'function greet(name) {\n  console.log("Hello, " + name);\n  return true;\n}\n\nconst users = ["Alice", "Bob", "Charlie"];\n\nfor (let i = 0; i < users.length; i++) {\n  greet(users[i]);\n}';

  document.getElementById('textRight').value = 'function greet(name, greeting = "Hello") {\n  console.log(greeting + ", " + name + "!");\n  return { success: true, name };\n}\n\nconst users = ["Alice", "Bob", "Charlie", "Diana"];\n\nusers.forEach(user => {\n  greet(user);\n});';
  
  if (autoDiffEnabled) runDiff();
}

  initTheme();
});
