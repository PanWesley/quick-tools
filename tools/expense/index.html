<!-- Expense Tracker 鐙珛 Service Worker 娉ㄥ唽锛堣鐩?pwa.js 鐨勯粯璁?/sw.js 娉ㄥ唽锛?-->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    // 鍏堟敞閿€鍙兘宸叉敞鍐岀殑涓荤珯 SW锛岄伩鍏嶅啿绐?
    navigator.serviceWorker.getRegistrations().then((registrations) => {
      registrations.forEach((reg) => {
        if (reg.scope && !reg.scope.includes('/tools/expense')) {
          console.log('[Expense PWA] Unregistering non-expense SW:', reg.scope);
          reg.unregister();
        }
      });
    });
    // 娉ㄥ唽鐢熸椿璐﹀崟鐙珛 SW
    navigator.serviceWorker.register('/tools/expense/sw.js', { scope: '/tools/expense/' })
      .then((registration) => {
        console.log('[Expense PWA] SW registered:', registration.scope);
      })
      .catch((error) => {
        console.log('[Expense PWA] SW registration failed:', error);
      });
  });
}
</script>
<script>
// Theme Management (inline for instant theme sync)
function initTheme() {
  const savedTheme = localStorage.getItem('quick-tools-theme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon(savedTheme);
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quick-tools-theme', newTheme);
  updateThemeIcon(newTheme);
}

function updateThemeIcon(theme) {
  const icon = document.getElementById('theme-icon');
  if (icon) icon.textContent = theme === 'dark' ? '鈽€锔? : '馃寵';
}

// View switching (inline for immediate nav response)
function switchView(viewName, skipHistory) {
  document.querySelectorAll('.view-section').forEach(function(sec) {
    sec.classList.remove('active');
  });
  document.querySelectorAll('.nav-item').forEach(function(nav) {
    nav.classList.remove('active');
  });
  const target = document.getElementById('view-' + viewName);
  if (target) target.classList.add('active');
  const navBtn = document.querySelector('.nav-item[data-view="' + viewName + '"]');
  if (navBtn) navBtn.classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });

  // Push state for browser back button support
  if (!skipHistory && history.state !== viewName) {
    history.pushState(viewName, '', '#view=' + viewName);
  }
}

// Handle browser back/forward buttons
window.addEventListener('popstate', function(e) {
  const viewName = e.state || 'dashboard';
  switchView(viewName, true);
  // Trigger rendering after view switch
  if (typeof window.refreshDashboard === 'function' && viewName === 'dashboard') {
    window.refreshDashboard();
  } else if (typeof window.renderExpenseList === 'function' && viewName === 'list') {
    window.renderExpenseList();
  } else if (typeof window.renderTagsList === 'function' && viewName === 'tags') {
    window.renderTagsList();
  }
});

document.addEventListener('DOMContentLoaded', initTheme);
</script>
