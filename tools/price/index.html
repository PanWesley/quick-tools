<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<script>
  (function() {
    var preference = localStorage.getItem('quick-tools-theme') || 'light';
    var theme = preference === 'system'
      ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      : preference;
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0F766E">
<meta name="description" content="买前省省：本地优先的买前查价与真低价判断工具。">
<link rel="icon" href="/icons/zhenjia-icon-96x96.png">
<link rel="manifest" href="/tools/price/manifest.json">
<link rel="apple-touch-icon" href="/icons/zhenjia-icon-192x192.png">
<link rel="apple-touch-icon" sizes="152x152" href="/icons/zhenjia-icon-152x152.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/zhenjia-icon-192x192.png">
<link rel="stylesheet" href="/shared/css/pwa.css?v=3">
<link rel="stylesheet" href="/tools/price/css/style.css?v=101">
<title>买前省省 - 买前查价</title>
</head>
<body>
<header class="app-header">
  <a class="brand" href="#home" data-view-link="home" aria-label="返回买前省省首页">
    <img src="/icons/zhenjia-icon.svg" alt="" aria-hidden="true" class="brand-mark" style="background: transparent; box-shadow: none;">
    <span>
      <strong>买前省省</strong>
      <small>聪明买买买，不花冤枉钱</small>
    </span>
  </a>
  <a class="header-link" href="/" aria-label="返回 Quick Tools">Quick Tools</a>
</header>

<main class="app-shell">
  <section class="view active" id="view-home" aria-labelledby="home-title">
    <div class="hero-panel">
      <div class="hero-copy">
        <p class="eyebrow">贴心价格管家</p>
        <h1 id="home-title">粘贴商品链接，帮你看看值不值</h1>
        <p>用本地记录和历史价格帮你判断是不是真划算，下单前多一份安心。</p>
        <div class="proof-rail" aria-label="价格验真流程">
          <span><strong>01</strong> 识别平台</span>
          <span><strong>02</strong> 对照历史</span>
          <span><strong>03</strong> 贴心建议</span>
        </div>
      </div>
      <form class="search-card" id="parse-form">
        <p class="search-kicker">✨ 价格小帮手</p>
        <label for="product-input">商品链接或分享文本</label>
        <textarea id="product-input" rows="4" placeholder="试试粘贴淘宝、京东、拼多多的商品链接呀～"></textarea>
        <div class="form-actions">
          <button class="btn primary" type="submit">帮我看看</button>
          <button class="btn ghost" type="button" id="use-sample-button">看看示例</button>
        </div>
        <p class="form-message" id="parse-message" role="status"></p>
      </form>
    </div>

    <section class="support-strip" aria-label="支持平台">
      <span>京东</span>
      <span>淘宝</span>
      <span>天猫</span>
      <span>拼多多</span>
    </section>

    <section class="section-block" aria-labelledby="sample-title">
      <div class="section-head">
        <div>
          <p class="eyebrow">先来看看</p>
          <h2 id="sample-title">不用真实链接，也能体验完整功能</h2>
        </div>
      </div>
      <div class="product-grid" id="sample-products"></div>
    </section>

    <section class="section-block" aria-labelledby="recent-title">
      <div class="section-head">
        <div>
          <p class="eyebrow">我的心愿单</p>
          <h2 id="recent-title">最近关注</h2>
        </div>
      </div>
      <div class="stack-list" id="recent-watches"></div>
    </section>
  </section>

  <section class="view" id="view-analysis" aria-labelledby="analysis-title">
    <button class="text-button" type="button" data-view-link="home">← 返回首页</button>
    <div class="truth-bench" id="truth-bench"></div>
    <section class="section-block">
      <div class="section-head">
        <div>
          <p class="eyebrow">价格走势</p>
          <h2 id="analysis-title">历史价格曲线</h2>
        </div>
        <div class="range-tabs" id="range-tabs">
          <button type="button" data-range="30" class="active">30 天</button>
          <button type="button" data-range="90">90 天</button>
          <button type="button" data-range="all">全部</button>
        </div>
      </div>
      <div class="chart-panel" id="price-chart"></div>
    </section>
    <section class="detail-grid">
      <form class="panel" id="snapshot-form">
        <h2>📝 记一笔价格</h2>
        <label>当前价格 <input id="snapshot-price" type="number" min="0" step="0.01" required placeholder="例如：199.00"></label>
        <label>备注 <input id="snapshot-note" type="text" placeholder="例如：店铺券后价、直播间价"></label>
        <button class="btn primary" type="submit">记录下来</button>
      </form>
      <form class="panel" id="watch-form">
        <h2>💝 加入心愿价</h2>
        <label>目标价 <input id="watch-target" type="number" min="0" step="0.01" required placeholder="降到多少钱愿意买～"></label>
        <button class="btn secondary" type="submit">加入关注</button>
        <p class="fine-print">先记在本地，降到心愿价会提醒你的哦～</p>
      </form>
    </section>
  </section>

  <section class="view" id="view-watches" aria-labelledby="watches-title">
    <div class="section-head">
      <div>
        <p class="eyebrow">心愿清单</p>
        <h1 id="watches-title">我的关注</h1>
      </div>
    </div>
    <div class="stack-list" id="watch-list"></div>
  </section>

  <section class="view" id="view-data" aria-labelledby="data-title">
    <div class="section-head">
      <div>
        <p class="eyebrow">数据管理</p>
        <h1 id="data-title">我的数据</h1>
      </div>
    </div>
    <section class="panel data-panel">
      <p>数据都保存在你的手机/电脑本地哦，随时可以导出备份～</p>
      <div class="button-row">
        <button class="btn secondary" id="export-button" type="button">导出数据</button>
        <label class="btn ghost file-button">导入数据<input id="import-file" type="file" accept="application/json"></label>
        <button class="btn danger" id="clear-button" type="button">清空数据</button>
      </div>
      <p class="form-message" id="data-message" role="status"></p>
    </section>
    <section class="panel data-panel">
      <p data-app-update-status role="status">检查一下有没有新版本吧～</p>
      <div class="button-row">
        <button class="btn secondary" type="button" data-app-update-button>检查更新</button>
      </div>
    </section>
  </section>
</main>

<nav class="bottom-nav" aria-label="主导航">
  <button class="nav-item active" type="button" data-view="home">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 2L2 7l10 5 10-5-10-5z"/>
      <path d="M2 17l10 5 10-5"/>
      <path d="M2 12l10 5 10-5"/>
    </svg>
    查价
  </button>
  <button class="nav-item" type="button" data-view="watches">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
    </svg>
    关注
  </button>
  <button class="nav-item" type="button" data-view="data">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="16" y1="13" x2="8" y2="13"/>
      <line x1="16" y1="17" x2="8" y2="17"/>
      <polyline points="10 9 9 9 8 9"/>
    </svg>
    数据
  </button>
</nav>

<script src="/tools/price/js/link-parser.js?v=101"></script>
<script src="/tools/price/js/price-judge.js?v=101"></script>
<script src="/tools/price/js/export.js?v=101"></script>
<script src="/tools/price/js/sample-data.js?v=101"></script>
<script src="/tools/price/js/db.js?v=101"></script>
<script src="/tools/price/js/chart.js?v=101"></script>
<script src="/shared/js/site-analytics-utils.js?v=1"></script>
<script src="/shared/js/site-analytics.js?v=1"></script>
<script src="/tools/price/js/app.js?v=101"></script>
<script src="/shared/js/app-update.js?v=1"></script>
</body>
</html>
